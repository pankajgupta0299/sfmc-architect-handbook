name: Handbook content validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate handbook content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run structural integrity checks
        run: python3 scripts/validate_handbook.py
      - name: Verify standalone use-case bank parity
        run: python3 scripts/sync_use_cases.py --check
